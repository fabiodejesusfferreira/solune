name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # O rustup do runner instala a versão de rust-toolchain.toml.
      - run: cargo fmt --all --check

  linux:
    name: Linux (clippy, build, testes)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # Do libmpv, só o runtime: o libmpv-dev puxa centenas de pacotes e o
      # espelho do apt já deixou o job parado por mais de 9 minutos. Os
      # bindings do daemon não usam cabeçalhos. O resto é o que o Tauri pede
      # no Linux (webview, bandeja, ícones).
      - name: Dependências de sistema
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 ffmpeg \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Teste de ponta a ponta do daemon (sem tela)
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=320x180:rate=30 -t 3 \
            -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/teste.mp4"
          SOLUNE_TEST_VIDEO="$RUNNER_TEMP/teste.mp4" cargo test -p solune-daemon -- --ignored

  js:
    name: JS (lint, tipos, testes, tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  windows:
    name: Windows (clippy)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # check e clippy não linkam, então ainda não precisam do libmpv. O
      # Tauri usa o WebView2, que já vem no runner.
      # O build completo no Windows entra quando o CI baixar um libmpv LGPL.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: Licenças e advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
