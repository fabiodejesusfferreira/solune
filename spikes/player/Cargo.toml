[package]
name = "solune-player-spike"
version = "0.0.0"
description = "Spike do player: libmpv tocando um vídeo como papel de parede"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "solune-player-spike"
path = "src/main.rs"

[lints]
workspace = true

# No Linux, tudo que é nativo (libwayland, libEGL, libX11) é carregado em tempo de
# execução, então o build não precisa de pacotes -dev.
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
wayland-egl = "0.32.11"
wayland-sys = { version = "0.31.11", features = ["dlopen"] }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
x11-dl = "2.21.0"
